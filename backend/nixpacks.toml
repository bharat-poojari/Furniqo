# nixpacks.toml
name = "furniqo-backend"

[phases.setup]
nixPkgs = ["nodejs_20", "npm_9"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = "npm run start"

[deploy]
healthcheck = "/api/health"
healthcheck_timeout = 100
healthcheck_interval = 15